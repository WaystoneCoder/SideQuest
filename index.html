<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Side Quest – Party Build 1.0</title><meta name="theme-color" content="#10151b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Side Quest"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>:root {
  font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  color: #f6eddc;
  background: #0b0f13;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --bg: #10151b;
  --panel: #181f27;
  --panel-2: #202832;
  --ink: #f6eddc;
  --muted: #9ca3aa;
  --line: #68717a;
  --pink: #f22e76;
  --pink-dark: #a40f47;
  --yellow: #ffc72c;
  --green: #4fe17b;
  --danger: #f44b65;
}

* { box-sizing: border-box; }
html, body, #root { min-height: 100%; margin: 0; }
body { background: #0a0e12; }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell {
  width: min(100vw, 820px);
  min-height: 100dvh;
  margin: 0 auto;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,.025), transparent 32%),
    var(--bg);
  padding: clamp(28px, 6vw, 56px) clamp(22px, 6vw, 56px);
  overflow: hidden;
}

.start-screen, .success-screen {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.start-mark, .success-mark { color: var(--yellow); font-size: 38px; margin-bottom: 12px; }
.logo { margin: 0; text-transform: uppercase; line-height: .88; letter-spacing: -0.05em; text-shadow: 5px 5px 0 #090c0f; }
.logo span { display: block; font-size: clamp(56px, 12vw, 96px); }
.logo strong { display: block; color: var(--yellow); font-size: clamp(62px, 14vw, 112px); text-shadow: 5px 5px 0 var(--pink-dark), 9px 9px 0 #090c0f; }
.tagline { color: #e8e0d2; line-height: 1.65; margin: 30px 0 42px; font-size: clamp(16px, 3vw, 22px); }
.start-actions { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; gap: 18px; }
.start-footer { margin-top: 54px; font-size: 11px; letter-spacing: .18em; color: #6f777f; }

.pixel-button {
  border: 2px solid #a7adb3;
  background: var(--panel-2);
  color: var(--ink);
  min-height: 58px;
  padding: 14px 24px;
  text-transform: uppercase;
  font-weight: 900;
  letter-spacing: .02em;
  cursor: pointer;
  box-shadow: 4px 4px 0 #080b0e;
  clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
}
.pixel-button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #080b0e; }
.pixel-button--full { width: 100%; }
.pixel-button--primary { background: var(--pink); border-color: #ff70a5; }
.pixel-button--secondary { background: #313943; }
.pixel-button--success { background: var(--green); color: #07150b; border-color: #8ff7ad; }
.pixel-button--danger { background: var(--danger); border-color: #ff8796; }
.pixel-button--ghost { background: transparent; border-color: #606a73; min-height: 50px; }

.game-screen { display: flex; flex-direction: column; gap: 30px; }
.player-header { text-align: center; }
.eyebrow { display: block; text-transform: uppercase; font-weight: 900; font-size: 25px; margin-bottom: 4px; }
.score { color: var(--yellow); font-weight: 950; font-size: clamp(54px, 12vw, 82px); line-height: 1; text-shadow: 4px 4px 0 var(--pink-dark); }
.rank-hint { display: inline-block; margin-top: 20px; border: 1px solid #69727a; padding: 9px 14px; color: #ddd5c8; text-transform: uppercase; font-size: 13px; }
h2, .simple-header h1 { text-align: center; text-transform: uppercase; font-size: clamp(24px, 5vw, 34px); margin: 0 0 22px; }
.simple-header p { text-align: center; color: #ccc4b8; line-height: 1.55; margin: 0; }

.mission-list { display: grid; gap: 16px; }
.mission-card {
  width: 100%;
  min-height: 118px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas: "points text action" "bonus text action";
  gap: 8px 18px;
  align-items: center;
  background: var(--panel);
  color: var(--ink);
  border: 2px solid #68717a;
  padding: 20px;
  text-align: left;
  clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);
}
.points-chip { grid-area: points; align-self: end; background: var(--pink); padding: 8px 10px; font-weight: 900; white-space: nowrap; }
.bonus-chip { grid-area: bonus; color: #111; background: var(--yellow); font-size: 11px; font-weight: 900; padding: 3px 7px; width: fit-content; }
.mission-card__text { grid-area: text; line-height: 1.5; font-size: clamp(15px, 2.6vw, 19px); }
.mission-card__open { grid-area: action; min-height: 48px; padding: 10px 16px; }
.empty-slot { border: 2px dashed #47515a; color: #939ba3; text-align: center; padding: 23px; text-transform: uppercase; }
.bottom-actions { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; }

.text-back { align-self: flex-start; background: none; border: 0; color: var(--ink); text-transform: uppercase; font-weight: 900; font-size: 16px; cursor: pointer; padding: 8px 0; }
.draw-list .mission-card { min-height: 122px; grid-template-columns: auto auto 1fr; grid-template-areas: "check points text"; cursor: pointer; }
.mission-card--selectable { font: inherit; }
.mission-card--selected { border-color: var(--pink); box-shadow: inset 0 0 0 2px #6f173b; }
.check { grid-area: check; width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid #d8d1c5; font-weight: 900; }
.check--on { border-color: var(--pink); color: var(--ink); background: #2d1721; }

.mission-detail { justify-content: flex-start; }
.detail-meta { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 25px; }
.big-points { font-size: clamp(50px, 12vw, 78px); color: var(--yellow); font-weight: 950; }
.difficulty { color: var(--pink); border: 2px solid var(--pink); padding: 9px 14px; text-transform: uppercase; font-weight: 900; }
.detail-title { max-width: 660px; margin: 8px auto 0; text-align: center; font-size: clamp(26px, 5vw, 42px); line-height: 1.35; }
.bonus-box { border-top: 2px solid #414952; border-bottom: 2px solid #414952; padding: 24px 0; display: grid; gap: 10px; text-align: center; }
.bonus-box strong { color: var(--pink); text-transform: uppercase; font-size: 21px; }
.bonus-box span { color: #d8d0c4; }
.detail-actions { display: grid; gap: 16px; margin-top: auto; justify-items: center; }

.success-screen h1 { text-transform: uppercase; font-size: clamp(42px, 9vw, 74px); margin: 0 0 35px; }
.result-panel, .score-panel { width: min(100%, 560px); background: var(--panel); border: 2px solid #626b74; padding: 26px; margin-bottom: 20px; text-align: center; }
.result-panel { border-color: var(--pink); display: grid; gap: 12px; }
.result-panel strong { font-size: clamp(38px, 8vw, 58px); }
.result-panel span { color: var(--yellow); text-transform: uppercase; font-weight: 900; }
.score-panel { text-transform: uppercase; font-size: 18px; }
.score-panel strong { color: var(--yellow); font-size: 26px; }
.success-screen .pixel-button { margin-top: 18px; min-width: 260px; }

@media (max-width: 640px) {
  .mission-card { grid-template-columns: auto 1fr; grid-template-areas: "points bonus" "text text" "action action"; }
  .mission-card__open { width: 100%; }
  .draw-list .mission-card { grid-template-columns: auto auto 1fr; grid-template-areas: "check points text"; }
}

/* Prototype 0.2 – Player onboarding */
.loading-label,
.tiny-label {
  color: var(--muted);
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: .18em;
  font-weight: 800;
}

.select-screen { min-height: 100dvh; }
.player-select-header { margin-top: clamp(30px, 7vh, 74px); }
.player-select-header h1 { margin-top: 12px; margin-bottom: 10px; }
.guest-grid {
  width: min(100%, 620px);
  margin: 18px auto 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.guest-button {
  min-height: 76px;
  background: var(--panel);
  color: var(--ink);
  border: 2px solid #626b74;
  padding: 14px 18px;
  text-transform: uppercase;
  font-weight: 900;
  font-size: clamp(18px, 3.2vw, 24px);
  cursor: pointer;
  box-shadow: 3px 3px 0 #080b0e;
  clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
}
.guest-button:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 #080b0e;
}

.confirm-screen,
.intro-screen {
  display: flex;
  min-height: 100dvh;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.confirm-question {
  margin: 20px 0 8px;
  color: #d3cabd;
  font-size: clamp(18px, 3.5vw, 24px);
}
.confirm-name {
  margin: 0 0 42px;
  color: var(--yellow);
  text-transform: uppercase;
  font-size: clamp(52px, 12vw, 94px);
  line-height: .95;
  text-shadow: 4px 4px 0 var(--pink-dark);
}
.confirm-actions {
  width: min(100%, 520px);
  display: grid;
  gap: 16px;
}

.intro-screen {
  max-width: 820px;
}
.intro-progress {
  position: absolute;
  top: clamp(28px, 5vw, 52px);
  right: clamp(22px, 6vw, 56px);
  color: #68717a;
  font-size: 12px;
  letter-spacing: .16em;
}
.intro-icon {
  width: 70px;
  height: 70px;
  margin-bottom: 26px;
  display: grid;
  place-items: center;
  color: var(--yellow);
  border: 2px solid #626b74;
  font-size: 36px;
  clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
}
.intro-icon--danger { color: var(--pink); border-color: var(--pink); }
.intro-screen h1 {
  margin: 12px 0 22px;
  text-transform: uppercase;
  font-size: clamp(34px, 7vw, 58px);
  line-height: 1.15;
}
.intro-copy {
  width: min(100%, 570px);
  margin: 0 0 42px;
  color: #d3cabd;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: clamp(17px, 2.8vw, 21px);
  line-height: 1.65;
}
.intro-screen .pixel-button { width: min(100%, 520px); }

@media (max-width: 520px) {
  .guest-grid { grid-template-columns: 1fr; }
}

/* Prototype 0.3 – persistent missions */
.info-panel,
.inline-message {
  border: 1px solid #59636d;
  background: #151b21;
  color: #c8c0b4;
  padding: 18px;
  line-height: 1.5;
  text-align: center;
}
.inline-message { width: 100%; font-size: 13px; }
.answer-screen { justify-content: flex-start; }
.answer-screen .simple-header { margin-top: clamp(20px, 4vh, 48px); }
.answer-screen .simple-header h1 { margin-top: 12px; }
.answer-screen .simple-header p { max-width: 620px; margin-inline: auto; }
.answer-input {
  width: 100%;
  min-height: 170px;
  resize: vertical;
  background: var(--panel);
  color: var(--ink);
  border: 2px solid #68717a;
  padding: 20px;
  font: 18px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  outline: none;
  clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);
}
.answer-input:focus { border-color: var(--pink); }
.bonus-confirm-screen { gap: 20px; }
.bonus-question {
  margin: 6px 0 12px;
  text-transform: uppercase;
  font-size: clamp(38px, 8vw, 64px);
}
.bonus-confirm-card {
  width: min(100%, 560px);
  margin-bottom: 16px;
  display: grid;
  gap: 12px;
  border: 2px solid var(--yellow);
  background: var(--panel);
  padding: 24px;
}
.bonus-confirm-card strong { color: var(--yellow); font-size: 28px; }
.bonus-confirm-card span { color: #d6cec2; line-height: 1.5; }

body{min-height:100vh}.prototype-note{position:fixed;right:10px;bottom:10px;font:11px ui-monospace,monospace;color:#76808a;z-index:9}

/* Prototype 0.4 – consequences, false calls, auto logout */
.consequence-screen,.penalty-screen{gap:20px}.consequence-screen h1,.penalty-screen h1{margin:4px 0 0;text-transform:uppercase;font-size:clamp(36px,7vw,58px)}
.consequence-copy{width:min(100%,560px);margin:0 auto 8px;color:#cfc7bb;line-height:1.6;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.consequence-card,.penalty-card{width:min(100%,600px);background:var(--panel);border:2px solid #68717a;padding:24px;display:grid;gap:18px;text-align:center;line-height:1.55}
.consequence-card span{color:#ded6c9}.consequence-card strong{color:var(--danger);font-size:clamp(30px,6vw,44px)}.penalty-card{border-color:var(--yellow);color:var(--ink);font-size:clamp(20px,4vw,30px);font-weight:800}
.danger-panel{border-color:var(--danger)}.danger-panel span{color:#ff9eaa}.logout-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px;background:rgba(4,7,10,.82);backdrop-filter:blur(5px)}
.logout-card{width:min(100%,520px);background:var(--panel);border:2px solid #747d86;padding:30px;display:grid;gap:16px;text-align:center;box-shadow:8px 8px 0 #06090c}.logout-card h2{margin:2px 0;font-size:clamp(30px,6vw,44px)}.logout-card p{margin:0 0 8px;color:#cfc7bb;line-height:1.55;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}


/* Prototype 0.5 – admin and finale */
.finale-banner{width:min(100%,560px);margin:0 0 24px;padding:14px 18px;border:2px solid var(--yellow);color:var(--yellow);text-align:center;text-transform:uppercase;font-weight:900;letter-spacing:.04em}
.admin-login{gap:18px}.admin-input,.admin-number{width:min(100%,420px);background:var(--panel);color:var(--ink);border:2px solid #68717a;padding:16px 18px;font-size:22px;text-align:center;outline:none}.admin-input:focus,.admin-number:focus{border-color:var(--pink)}
.admin-dashboard{gap:18px}.admin-status{width:min(100%,600px);padding:18px;border:2px solid #626b74;background:var(--panel);display:flex;justify-content:space-between;gap:20px;align-items:center}.admin-status strong{color:var(--yellow);text-transform:uppercase}.admin-menu{width:min(100%,600px);display:grid;gap:14px;margin-inline:auto}.admin-note{color:var(--muted);font-size:13px;line-height:1.5;text-align:center}
.admin-player-row{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:16px 18px;background:var(--panel);border:2px solid #626b74;color:var(--ink);text-align:left;cursor:pointer}.admin-player-row strong{text-transform:uppercase}.admin-player-row span{color:var(--yellow);font-weight:900}.admin-player-row em{font-style:normal;color:var(--muted);font-size:12px;text-transform:uppercase}
.admin-adjust-box{width:min(100%,560px);display:grid;gap:14px;margin-inline:auto;padding:24px;border:2px solid #626b74;background:var(--panel)}.admin-adjust-box label{color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.12em}.admin-adjust-box .admin-number{width:100%}
.ended-screen .logo{margin-bottom:28px}.ended-score-note{color:#d4ccbf;max-width:540px;line-height:1.6;margin-bottom:30px}.finale-clock{font-size:clamp(42px,9vw,70px);color:var(--yellow);font-weight:950;margin:6px 0}

/* Prototype 0.6 – settlement */
.settlement-screen{min-height:100dvh}.settlement-intro,.ranking-screen{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px}.settlement-intro h1,.ranking-screen h1,.settlement-player-header h1{margin:0;text-transform:uppercase;font-size:clamp(38px,8vw,68px)}.settlement-intro>p,.ranking-screen>p{width:min(100%,560px);margin:0;color:#d2cabd;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65;font-size:clamp(17px,2.8vw,21px)}.settlement-intro .pixel-button,.ranking-screen .pixel-button{width:min(100%,540px)}.settlement-icon{width:76px;height:76px;display:grid;place-items:center;border:2px solid var(--yellow);color:var(--yellow);font-size:40px}.settlement-start-meta{width:min(100%,360px);display:grid;gap:4px;padding:18px;border:2px solid #5f6871;background:var(--panel);text-transform:uppercase}.settlement-start-meta strong{color:var(--yellow);font-size:34px}.settlement-start-meta span{color:var(--muted);font-size:12px}.settlement-progress{align-self:flex-end;color:var(--muted);font-size:12px;letter-spacing:.14em}.settlement-player-header{display:grid;gap:8px}.settlement-player-header h1{color:var(--yellow);text-shadow:4px 4px 0 var(--pink-dark)}.settlement-ledger{width:min(100%,620px);margin-inline:auto;border:2px solid #626b74;background:var(--panel)}.score-line,.settlement-total{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:16px 20px;border-bottom:1px solid #3b444d}.score-line span,.settlement-total span{color:#d8d0c4;text-transform:uppercase}.score-line strong{font-size:19px}.score-positive{color:var(--green)}.score-negative{color:#ff8796}.settlement-total{border-bottom:0;background:#202832;margin-top:4px}.settlement-total strong{color:var(--yellow);font-size:clamp(30px,6vw,44px)}.settlement-actions{width:min(100%,620px);display:grid;gap:14px;margin-inline:auto}.recap-list{width:min(100%,650px);margin-inline:auto;display:grid;gap:16px}.recap-card{border:2px solid #626b74;background:var(--panel);padding:20px;display:grid;gap:14px}.recap-card p{margin:0;color:#e5ddd1;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;line-height:1.55}.recap-meta{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px}.recap-meta strong{color:var(--yellow)}.recap-answer{border-top:1px solid #414952;padding-top:14px;display:grid;gap:6px}.recap-answer span{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.12em}.recap-answer strong{color:var(--yellow);font-size:20px}.ranking-list{width:min(100%,620px);display:grid;gap:10px}.ranking-row{min-height:62px;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 18px;border:2px solid #58616a;background:var(--panel);text-align:left}.ranking-row--podium{border-color:#8b7b40}.ranking-row strong{text-transform:uppercase;font-size:19px}.ranking-row>span:last-child{color:var(--yellow);font-weight:900}.ranking-place{color:var(--muted);font-weight:900}.ranking-row:first-child .ranking-place{color:var(--yellow);font-size:26px}.winner-card{width:min(100%,620px);display:grid;gap:6px;padding:22px;border:2px solid var(--yellow);background:#1b2024;text-transform:uppercase}.winner-card span{color:var(--muted);font-size:11px;letter-spacing:.15em}.winner-card strong{color:var(--yellow);font-size:clamp(30px,6vw,48px)}.winner-card em{color:#e5ddd1;font-style:normal}


/* Prototype 0.7 – admin prep */

/* Party Build 1.0 – preparation */

function uid(prefix){return prefix+'-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2))}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function rankHint(name){const ps=activePlayers();if(ps.length<=1)return 'Noch keine Konkurrenz – hol dir deine ersten Missionen.';const scores=ps.map(p=>({name:p.name,score:scoreFor(p.name)})).sort((a,b)=>b.score-a.score);const rank=scores.findIndex(x=>x.name===name)+1;if(rank<=3)return 'Du bist aktuell auf einem Podiumsplatz.';if(rank<=5)return 'Du bist aktuell in den Top 5.';const gap=Math.max(0,(scores[2]?.score||0)-scoreFor(name));return `Dir fehlen ${gap} Punkt${gap===1?'':'e'} zu den Top 3.`}

function shuffle(xs){const a=[...xs];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderText(t,target){return t.replaceAll('{TARGET}',target||'')}
function prepareDraw(){const used=new Set(state.assignments.filter(a=>a.player===currentPlayer).map(a=>a.templateId));const active=state.assignments.filter(a=>a.status==='active');const targets=activePlayers().map(p=>p.name).filter(n=>n!==currentPlayer);const targetCounts={};state.assignments.filter(a=>a.player===currentPlayer&&a.target).forEach(a=>targetCounts[a.target]=(targetCounts[a.target]||0)+1);const opts=[];for(const t of shuffle(templates.filter(t=>templateActive(t.id)&&!used.has(t.id)))){if(opts.length>=3)break;if(!t.requiresTarget){opts.push({optionId:uid('option'),templateId:t.id,text:t.textTemplate,points:t.points,difficulty:t.difficulty,bonusText:t.bonusText,bonusPoints:t.bonusPoints,requiresAnswer:t.requiresAnswer});continue}const valid=targets.filter(target=>!active.some(a=>a.templateId===t.id&&a.target===target));if(!valid.length)continue;const min=Math.min(...valid.map(x=>targetCounts[x]||0));const target=shuffle(valid.filter(x=>(targetCounts[x]||0)===min))[0];opts.push({optionId:uid('option'),templateId:t.id,target,text:renderText(t.textTemplate,target),points:t.points,difficulty:t.difficulty,bonusText:t.bonusText?renderText(t.bonusText,target):null,bonusPoints:t.bonusPoints,requiresAnswer:t.requiresAnswer})}drawOptions=opts;selectedDrawIds=opts[0]?[opts[0].optionId]:[];go('draw')}
function toggleDraw(id){const max=Math.max(1,3-activeAssignments().length);if(selectedDrawIds.includes(id)){if(selectedDrawIds.length>1)selectedDrawIds=selectedDrawIds.filter(x=>x!==id)}else if(selectedDrawIds.length<max)selectedDrawIds.push(id);render()}
function takeMissions(){const slots=3-activeAssignments().length;const selected=drawOptions.filter(o=>selectedDrawIds.includes(o.optionId)).slice(0,slots);const now=new Date().toISOString();for(const o of selected)state.assignments.push({id:uid('assignment'),player:currentPlayer,templateId:o.templateId,target:o.target||null,text:o.text,points:o.points,difficulty:o.difficulty,bonusText:o.bonusText||null,bonusPoints:o.bonusPoints||0,requiresAnswer:o.requiresAnswer,status:'active',isSafe:false,acceptedAt:now});save();go('dashboard')}

function finalize(bonus){const a=state.assignments.find(x=>x.id===currentMission.id);if(!a||a.status!=='active')return;a.status='completed';a.isSafe=true;a.bonusCompleted=!!bonus;a.completedAt=new Date().toISOString();if(answerText)state.answers.push({id:uid('answer'),assignmentId:a.id,player:currentPlayer,target:a.target,text:answerText});state.pointEvents.push({id:uid('point'),player:currentPlayer,assignmentId:a.id,type:'mission_completed',amount:a.points,createdAt:new Date().toISOString(),voided:false});if(bonus&&a.bonusPoints)state.pointEvents.push({id:uid('point'),player:currentPlayer,assignmentId:a.id,type:'mission_bonus',amount:a.bonusPoints,createdAt:new Date().toISOString(),voided:false});save();lastGain={main:a.points,bonus:bonus?a.bonusPoints:0,score:scoreFor(currentPlayer)};go('success')}

function drawPenalty(name){const used=new Set(state.penaltyAssignments.filter(x=>x.player===name).map(x=>x.index));let choices=penalties.map((_,i)=>i).filter(i=>!used.has(i));if(!choices.length)choices=penalties.map((_,i)=>i);const index=choices[Math.floor(Math.random()*choices.length)];currentPenalty={id:uid('penalty'),player:name,index,text:penalties[index]};state.penaltyAssignments.push(currentPenalty);save();go('penaltyReveal')}

function prePartyReport(){const activeM=templates.filter(t=>templateActive(t.id));const generic=activeM.filter(t=>!t.requiresTarget).length;const activeP=activePlayers().length;const liveEvents=state.pointEvents.filter(e=>!e.voided).length;const fresh=state.game.status==='running'&&activeP===0&&state.assignments.length===0&&liveEvents===0;const checks=[['Gästeliste',state.guestList.filter(g=>g.enabled).length>=6?'ok':state.guestList.filter(g=>g.enabled).length>=2?'warning':'error',`${state.guestList.filter(g=>g.enabled).length} aktive Gäste vorbereitet`],['Missionspool',activeM.length>=70?'ok':activeM.length>=40?'warning':'error',`${activeM.length} Missionen aktiv`],['Frühe Spielphase',generic>=10?'ok':generic>=5?'warning':'error',`${generic} Missionen ohne feste Zielperson`],['Strafaufgaben',penalties.length>=20?'ok':'warning',`${penalties.length} Strafaufgaben verfügbar`],['Admin-PIN',state.game.adminPin!=='2468'?'ok':'warning',state.game.adminPin!=='2468'?'Individuelle PIN gesetzt':'Noch Standard-PIN 2468'],['Backup',state.game.lastBackupAt?'ok':'warning',state.game.lastBackupAt?`Zuletzt ${new Date(state.game.lastBackupAt).toLocaleString('de-DE')}`:'Noch kein Backup exportiert'],['Spielstand',fresh?'ok':'warning',fresh?'Frischer Spielstand – bereit für die Feier':'Es sind bereits Test-/Spieldaten vorhanden']];return {activeM,generic,fresh,checks}}
function historyItems(){const labels={mission_completed:'Mission erfüllt',mission_called_penalty:'Mission gecallt',mission_discard_penalty:'Mission verworfen',mission_open_penalty:'Offene Mission',admin_adjustment:'Admin-Korrektur'};const canMission=['running','finale'].includes(state.game.status);return state.pointEvents.filter(e=>e.type!=='mission_bonus').map((e,i)=>({...e,_i:i,label:labels[e.type]||e.type,reversible:!e.voided&&!['settlement','completed'].includes(state.game.status)&&(e.type==='admin_adjustment'||(canMission&&['mission_completed','mission_called_penalty','mission_discard_penalty'].includes(e.type)))})).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')||b._i-a._i)}
function undoEvent(id){if(!confirm('Dieses Ereignis wirklich rückgängig machen?'))return;const e=state.pointEvents.find(x=>x.id===id);if(!e||e.voided)return;if(['settlement','completed'].includes(state.game.status)){adminMessage='Die Endabrechnung ist bereits eingefroren.';render();return}if(e.type==='admin_adjustment'){e.voided=true}else{if(!['running','finale'].includes(state.game.status)){adminMessage='Missionen können nach Spielende nicht reaktiviert werden.';render();return}const a=state.assignments.find(x=>x.id===e.assignmentId);if(!a)return;if(e.type==='mission_completed'){state.pointEvents.filter(x=>x.assignmentId===a.id&&['mission_completed','mission_bonus'].includes(x.type)).forEach(x=>x.voided=true);state.answers=state.answers.filter(x=>x.assignmentId!==a.id);a.status='active';a.isSafe=false;a.bonusCompleted=false;delete a.completedAt}else if(e.type==='mission_called_penalty'){e.voided=true;a.status='active';a.isSafe=false;delete a.calledAt}else if(e.type==='mission_discard_penalty'){e.voided=true;a.status='active';a.isSafe=false;delete a.discardedAt}else return}state.adminActions.push({id:uid('admin'),type:'event_undone',description:`${e.type} rückgängig gemacht`,eventId:id,createdAt:new Date().toISOString()});save();adminMessage='Ereignis rückgängig gemacht.';render()}
function backupPayload(){const exportedAt=new Date().toISOString();state.game.lastBackupAt=exportedAt;save();return {app:'side-quest',schemaVersion:1,exportedAt,state}}
function exportBackup(){const blob=new Blob([JSON.stringify(backupPayload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`side-quest-backup-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;a.click();URL.revokeObjectURL(url);adminMessage='Backup exportiert.';render()}
async function importBackup(input){const file=input.files?.[0];if(!file)return;if(!confirm('Lokalen Spielstand durch dieses Backup ersetzen?'))return;try{const payload=JSON.parse(await file.text());if(payload?.app!=='side-quest'||payload?.schemaVersion!==1||!payload.state?.players||!Array.isArray(payload.state.guestList))throw new Error('Ungültige Backup-Datei.');state=payload.state;state.adminActions=state.adminActions||[];state.pointEvents=(state.pointEvents||[]).map(e=>({...e,voided:!!e.voided}));state.adminActions.push({id:uid('admin'),type:'backup_imported',description:'Backup importiert',createdAt:new Date().toISOString()});save();location.reload()}catch(err){adminMessage=err?.message||'Backup konnte nicht importiert werden.';render()}}
function settlementSnapshot(){
  const ps=activePlayers().sort((a,b)=>a.name.localeCompare(b.name,'de'));
  return ps.map(p=>{
    const own=state.pointEvents.filter(e=>e.player===p.name&&!e.voided);
    const sum=type=>own.filter(e=>e.type===type).reduce((a,e)=>a+e.amount,0);
    return {id:'settlement-'+p.name,player:p.name,missionPoints:sum('mission_completed'),bonusPoints:sum('mission_bonus'),callPenalties:sum('mission_called_penalty'),discardPenalties:sum('mission_discard_penalty'),openPenalties:sum('mission_open_penalty'),adminAdjustments:sum('admin_adjustment'),finalScore:own.reduce((a,e)=>a+e.amount,0)};
  })
}
function startSettlement(){
  if(state.game.status==='running'||state.game.status==='finale')return;
  if(!state.settlementRecords.length)state.settlementRecords=settlementSnapshot();
  state.game.status='settlement';state.game.settlementStartedAt=state.game.settlementStartedAt||new Date().toISOString();
  settlementIndex=0;rankingVisible=false;save();go('settlementIntro')
}
function settlementRecap(player){
  const answers=new Map(state.answers.filter(a=>a.player===player).map(a=>[a.assignmentId,a.text]));
  return state.assignments.filter(a=>a.player===player&&['completed','called','open_at_end'].includes(a.status)).map(a=>{
    let priority=(answers.has(a.id)?100:0)+(a.status==='completed'&&a.bonusCompleted?50:0)+(a.status==='called'?35:0)+(a.status==='open_at_end'?25:0)+a.points;
    return {...a,answer:answers.get(a.id),priority}
  }).sort((a,b)=>b.priority-a.priority).slice(0,3)
}
function ranking(){
  const sorted=[...state.settlementRecords].sort((a,b)=>b.finalScore-a.finalScore||a.player.localeCompare(b.player,'de'));
  let lastScore, lastRank=0;
  return sorted.map((r,i)=>{const rank=r.finalScore===lastScore?lastRank:i+1;lastScore=r.finalScore;lastRank=rank;return {...r,rank}})
}
function showSettlementPlayer(i){settlementIndex=i;go('settlementPlayer')}
function advanceSettlement(){if(settlementIndex+1<state.settlementRecords.length){settlementIndex++;go('settlementPlayer')}else{rankingVisible=false;go('rankingReveal')}}
function revealRanking(){rankingVisible=true;state.game.status='completed';state.game.settlementCompletedAt=new Date().toISOString();save();render()}
function openCompletedRanking(){if(!state.settlementRecords.length){startSettlement();return}rankingVisible=true;go('rankingReveal')}
function resetGamePrototype(){if(!confirm('Spiel wirklich komplett zurücksetzen?'))return;state=blank();save();currentPlayer=null;adminSelectedPlayer=null;settlementIndex=0;rankingVisible=false;go('adminDashboard')}

 else if(screen==='adminDashboard'){const rem=finaleRemaining(), status=state.game.status==='running'?'SPIEL LÄUFT':state.game.status==='finale'?'FINAL ROUND':state.game.status==='ended'?'BEENDET':state.game.status==='settlement'?'ENDABRECHNUNG':'ABGESCHLOSSEN';h=`<main class="app-shell game-screen admin-dashboard"><button class="text-back" onclick="go('start')">← Schließen</button><header class="simple-header"><span class="tiny-label">ADMIN</span><h1>Spielsteuerung</h1></header><div class="admin-status"><span>Status</span><strong>${status}</strong></div>${state.game.status==='finale'?`<div class="finale-clock">${formatClock(rem)}</div>`:''}<div class="admin-menu">${btn('Gästeliste','secondary',"go('adminGuests')",true)}${btn('Missionen verwalten','secondary',"go('adminMissions')",true)}${btn('Einstellungen / PIN','secondary',"go('adminSettings')",true)}${btn('Pre-Party-Check','secondary',"go('adminPreParty')",true)}${btn('Spieler & Punkte','secondary',"go('adminPlayers')",true)}${btn('Ereignishistorie / Undo','secondary',"go('adminHistory')",true)}${btn('Backup / Restore','secondary',"go('adminBackup')",true)}${state.game.status==='running'?btn('30-Minuten-Finale starten','primary','startFinale()',true):''}${['running','finale'].includes(state.game.status)?btn('Spiel beenden','danger',"if(confirm('Spiel wirklich beenden? Offene Missionen werden abgerechnet.')) endGame()",true):''}${['ended','settlement'].includes(state.game.status)?btn('Endabrechnung starten','primary','startSettlement()',true):''}${state.game.status==='completed'?btn('Finales Ranking ansehen','primary','openCompletedRanking()',true):''}${btn('Spiel zurücksetzen','ghost','resetGamePrototype()',true)}</div><p class="admin-note">Spielende ist idempotent: offene Missionsstrafen werden pro Mission nur einmal verbucht.</p></main>`}

 else if(screen==='adminMissions'){const cats=[...new Set(templates.map(t=>t.category))].sort(),visible=templates.filter(t=>missionFilter==='all'||t.category===missionFilter),activeCount=templates.filter(t=>templateActive(t.id)).length;h=`<main class="app-shell game-screen"><button class="text-back" onclick="go('adminDashboard')">← Zurück</button><header class="simple-header"><span class="tiny-label">ADMIN</span><h1>Missionen</h1><p>${activeCount} von ${templates.length} Missionen sind aktiv.</p></header>${adminMessage?`<div class="inline-message">${esc(adminMessage)}</div>`:''}<div class="mission-admin-toolbar"><select class="admin-select" onchange="missionFilter=this.value;render()"><option value="all" ${missionFilter==='all'?'selected':''}>Alle Kategorien</option>${cats.map(c=>`<option value="${c}" ${missionFilter===c?'selected':''}>${c}</option>`).join('')}</select><button onclick="setAllTemplates(true)">Alle an</button><button onclick="setAllTemplates(false)">Alle aus</button></div><div class="mission-admin-list">${visible.map(t=>`<button class="mission-admin-row ${templateActive(t.id)?'mission-admin-row--active':''}" onclick="toggleTemplate('${t.id}')"><div><strong>${t.id.toUpperCase()} · ${t.points} P</strong><span>${esc(t.textTemplate)}</span></div><em>${templateActive(t.id)?'AN':'AUS'}</em></button>`).join('')}</div></main>`}
 else if(screen==='adminSettings')h=`<main class="app-shell game-screen"><button class="text-back" onclick="go('adminDashboard')">← Zurück</button><header class="simple-header"><span class="tiny-label">ADMIN</span><h1>Einstellungen</h1><p>Die PIN gilt nur lokal auf diesem Tablet.</p></header><div class="settings-panel"><label>Neue Admin-PIN</label><input id="newAdminPin" class="admin-input" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 Ziffern">${btn('PIN speichern','primary','setAdminPinAdmin()',true)}${adminMessage?`<div class="inline-message">${esc(adminMessage)}</div>`:''}<p class="admin-note">Vor der Feier unbedingt die Standard-PIN ändern.</p></div></main>`;
 else if(screen==='adminPreParty'){const r=prePartyReport();h=`<main class="app-shell game-screen"><button class="text-back" onclick="go('adminDashboard')">← Zurück</button><header class="simple-header"><span class="tiny-label">READY CHECK</span><h1>Pre-Party-Check</h1><p>Der Check prüft Gästeliste, Content und lokalen Spielstand.</p></header><div class="preparty-summary"><strong>${state.guestList.filter(g=>g.enabled).length}</strong><span>Gäste</span><strong>${r.activeM.length}</strong><span>Missionen</span><strong>${penalties.length}</strong><span>Strafaufgaben</span></div><div class="preparty-list">${r.checks.map(c=>`<div class="preparty-row preparty-row--${c[1]}"><span>${c[1]==='ok'?'✓':c[1]==='warning'?'!':'×'}</span><div><strong>${c[0]}</strong><p>${c[2]}</p></div></div>`).join('')}</div>${btn('Neu prüfen','secondary','render()',true)}<p class="admin-note">Zusätzlich vor Ort einmal Flugmodus aktivieren, App neu öffnen und Tablet neu starten.</p></main>`}
 else if(screen==='adminHistory'){const items=historyItems();h=`<main class="app-shell game-screen"><button class="text-back" onclick="go('adminDashboard')">← Zurück</button><header class="simple-header"><span class="tiny-label">ADMIN</span><h1>Ereignishistorie</h1><p>Undo reaktiviert Missionen nur solange das Spiel noch läuft. Nach Start der Endabrechnung bleibt der Snapshot eingefroren.</p></header>${adminMessage?`<div class="inline-message">${esc(adminMessage)}</div>`:''}<div class="history-list">${items.length?items.map(e=>`<div class="history-row ${e.voided?'history-row--voided':''}"><div class="history-copy"><strong>${esc(e.player)}</strong><span>${esc(e.label)}${e.createdAt?' · '+new Date(e.createdAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''}</span></div><b class="${e.amount<0?'score-negative':'score-positive'}">${e.amount>0?'+':''}${e.amount} P</b>${e.voided?'<em>Rückgängig</em>':e.reversible?`<button onclick="undoEvent('${e.id}')">Undo</button>`:'<em>Fixiert</em>'}</div>`).join(''):'<div class="info-panel">Noch keine Punkteereignisse.</div>'}</div></main>`}
 else if(screen==='adminBackup')h=`<main class="app-shell game-screen"><button class="text-back" onclick="go('adminDashboard')">← Zurück</button><header class="simple-header"><span class="tiny-label">ADMIN</span><h1>Backup / Restore</h1><p>Exportiert den kompletten lokalen Spielstand als JSON. Ein Import ersetzt den aktuellen Stand vollständig.</p></header><div class="backup-panel">${btn('Backup exportieren','primary','exportBackup()',true)}<label class="file-import"><span>Backup importieren</span><input type="file" accept="application/json,.json" onchange="importBackup(this)"></label>${adminMessage?`<div class="inline-message">${esc(adminMessage)}</div>`:''}<p class="admin-note">Empfehlung: nach der finalen Gästeliste und vor der Endabrechnung exportieren.</p></div></main>`;
 else if(screen==='adminPlayers')h=`<main class="app-shell game-screen"><button class="text-back" onclick="go('adminDashboard')">← Zurück</button><header class="simple-header"><span class="tiny-label">ADMIN</span><h1>Spieler & Punkte</h1></header><div class="mission-list">${activePlayers().map(p=>`<button class="admin-player-row" onclick="selectAdminPlayer('${p.name}')"><strong>${esc(p.name)}</strong><span>${scoreFor(p.name)} P</span><em>öffnen ›</em></button>`).join('')||'<div class="info-panel">Noch keine aktiven Spieler.</div>'}</div></main>`;
 else if(screen==='settlementIntro')h=`<main class="app-shell settlement-screen settlement-intro"><span class="tiny-label">SCORE COUNT</span><div class="settlement-icon">▦</div><h1>Endabrechnung</h1><p>Wir rechnen jetzt Spieler für Spieler ab. Das vollständige Ranking bleibt bis zum Schluss geheim.</p><div class="settlement-start-meta"><strong>${state.settlementRecords.length}</strong><span>aktive Spieler</span></div>${btn("Los geht's ▶",'primary','showSettlementPlayer(0)',true)}</main>`;
 else if(screen==='settlementPlayer'){const r=state.settlementRecords[settlementIndex],last=settlementIndex===state.settlementRecords.length-1;const line=(label,v)=>`<div class="score-line"><span>${label}</span><strong class="${v>0?'score-positive':v<0?'score-negative':''}">${v>0?'+':''}${v} P</strong></div>`;h=`<main class="app-shell game-screen settlement-screen"><div class="settlement-progress">${settlementIndex+1} / ${state.settlementRecords.length}</div><header class="player-header settlement-player-header"><span class="tiny-label">ALS NÄCHSTES</span><h1>${esc(r.player)}</h1></header><div class="settlement-ledger">${line('Missionen',r.missionPoints)}${line('Bonus',r.bonusPoints)}${line('Calls',r.callPenalties)}${line('Discards',r.discardPenalties)}${line('Offen',r.openPenalties)}${r.adminAdjustments?line('Korrektur',r.adminAdjustments):''}<div class="settlement-total"><span>Final Score</span><strong>${r.finalScore} P</strong></div></div><div class="settlement-actions">${btn('Missionen ansehen','secondary',"go('settlementRecap')",true)}${btn(last?'Zum Ranking ▶':'Nächster Spieler ▶','primary','advanceSettlement()',true)}</div></main>`}
 else if(screen==='settlementRecap'){const r=state.settlementRecords[settlementIndex],items=settlementRecap(r.player);h=`<main class="app-shell game-screen settlement-screen"><button class="text-back" onclick="go('settlementPlayer')">← Zurück</button><header class="simple-header"><span class="tiny-label">MISSION RECAP</span><h1>${esc(r.player)}</h1><p>Ein paar Missionen aus dem Abend.</p></header><div class="recap-list">${items.length?items.map(a=>{const status=a.status==='completed'?'✓ ERFÜLLT':a.status==='called'?'⚠ GECALLT':'⏳ OFFEN';const score=a.status==='completed'?`+${a.points}${a.bonusCompleted?` + ${a.bonusPoints} Bonus`:''}`:a.status==='called'?`−${a.points} P`:`−${Math.ceil(a.points*.5)} P`;return `<div class="recap-card"><div class="recap-meta"><span>${status}</span><strong>${score}</strong></div><p>${esc(a.text)}</p>${a.answer?`<div class="recap-answer"><span>Antwort</span><strong>${esc(a.answer)}</strong></div>`:''}</div>`}).join(''):'<div class="info-panel">Für diesen Spieler gibt es noch keinen interessanten Missionsrückblick.</div>'}</div>${btn('Zur Abrechnung','primary',"go('settlementPlayer')",true)}</main>`}
 else if(screen==='rankingReveal'){const rows=ranking();h=`<main class="app-shell settlement-screen ranking-screen"><span class="tiny-label">FINAL RANKING</span>${!rankingVisible?`<div class="settlement-icon">♛</div><h1>Wer hat gewonnen?</h1><p>Alle Spieler sind abgerechnet. Jetzt wird das Ranking aufgedeckt.</p>${btn('Ranking aufdecken','primary','revealRanking()',true)}`:`<h1>Final Ranking</h1><div class="ranking-list">${rows.map(x=>`<div class="ranking-row ${x.rank<=3?'ranking-row--podium':''}"><span class="ranking-place">${x.rank===1?'♛':x.rank+'.'}</span><strong>${esc(x.player)}</strong><span>${x.finalScore} P</span></div>`).join('')}</div>${rows[0]?`<div class="winner-card"><span>Gewinner</span><strong>${esc(rows[0].player)}</strong><em>${rows[0].finalScore} Punkte</em></div>`:''}${btn('Fertig','secondary',"go('start')",true)}`}</main>`}
 else if(screen==='adminPlayer')h=`<main class="app-shell game-screen"><button class="text-back" onclick="go('adminPlayers')">← Zurück</button><header class="player-header"><span class="eyebrow">${esc(adminSelectedPlayer)}</span><div class="score">${scoreFor(adminSelectedPlayer)} P</div></header><div class="admin-adjust-box"><label>Punktekorrektur</label><input id="adjustInput" class="admin-number" type="number" step="1" placeholder="z. B. 4 oder -4">${adminMessage?`<div class="inline-message">${esc(adminMessage)}</div>`:''}${btn('Korrektur speichern','primary','adminAdjust()',true)}</div></main>`;
 app.innerHTML=h+overlayHTML();}
setInterval(()=>{if(state.game.status==='finale'&&(screen==='start'||screen==='adminDashboard'))render()},1000);
render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
